rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/var/lib/docker",device="/dev/test"}'
        values: '19+0x11 35 35'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/var/lib/docker",device="/dev/test"}'
        values: '100+0x13'
      - series: 'node_filesystem_readonly{fstype="ext4",mountpoint="/var/lib/docker",device="/dev/test"}'
        values: '0+0x13'
    alert_rule_test:
      - eval_time: 9m
        alertname: MiniDiskSpaceLow
        exp_alerts: []
      - eval_time: 10m
        alertname: MiniDiskSpaceLow
        exp_alerts:
          - exp_labels: { severity: warning, fstype: ext4, mountpoint: /var/lib/docker, device: /dev/test }
            exp_annotations: { summary: '/var/lib/docker has less than 20% free space' }
      - eval_time: 12m
        alertname: MiniDiskSpaceLow
        exp_alerts: []
