global:
  scrape_interval: 5s
  evaluation_interval: 5s
alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['api:2568'] }]
  - job_name: game
    static_configs: [{ targets: ['game:2569'] }]
  - job_name: livekit
    static_configs: [{ targets: ['livekit:6789'] }]
  - job_name: node
    static_configs: [{ targets: ['node:9100'] }]
